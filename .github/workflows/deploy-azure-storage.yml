name: Deploy to Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Hashed bundles never change, so they can be cached forever.
      - name: Upload hashed assets
        run: >
          az storage blob upload-batch --only-show-errors --overwrite
          --destination '$web' --source dist --pattern '_astro/*'
          --content-cache-control 'public, max-age=31536000, immutable'

      - name: Upload media
        run: |
          for dir in frames posters video assets; do
            az storage blob upload-batch --only-show-errors --overwrite \
              --destination '$web' --source dist --pattern "$dir/*" \
              --content-cache-control 'public, max-age=2592000'
          done

      # HTML must always be revalidated so new deploys show up immediately.
      - name: Upload pages
        run: >
          az storage blob upload-batch --only-show-errors --overwrite
          --destination '$web' --source dist --pattern '*.html'
          --content-cache-control 'no-cache'
